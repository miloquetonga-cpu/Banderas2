<div id="fv" onclick="fvX()" style="position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center"><canvas id="fvc" style="background:#222"></canvas><div style="position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px"><button class="g" onclick="event.stopPropagation();fvR=!fvR;fvD()">Girar</button><button class="g" onclick="fvX(event)">Cerrar</button></div></div>
<script>
if(typeof claude==='undefined')window.claude={use:async()=>null};
const $=s=>document.querySelector(s);
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
try{if(!localStorage.getItem('bundone')){const a=localStorage.getItem('bacc');if(a){['bf','bw','bc','bs','bclip','bdw','br'].forEach(k=>{const v=localStorage.getItem('u:'+a+':'+k);if(v!=null)localStorage.setItem(k,v)})}localStorage.setItem('bundone','1')}}catch(e){}let flags=[],worlds=[{id:1,name:'Mundo 1',sea:'#1d4e7a',cs:[]}],wi=0,layers=[{t:'solid',c:'#22bb00',s:100,x:50,y:50,r:0}],sel=0,editId=null,hv=[0.33,1,.8],selF=null;
function mg1(){worlds.forEach(w=>{w.cs.forEach(c=>{if(c.p){c.ps=[c.p];delete c.p}if(!c.v){c.ps.forEach(q=>{if(ar(q)<0)q.reverse()});c.v=2}});if(!w.fl)w.fl=[...new Set(w.cs.map(c=>c.f))]})}
const T=['solid','h2','fm2','h3','fta','fme','fba','mfa','mfm','mfb','v2','vm2','fl3','v3','fr3','cross','nordic','saltire','half','hr','ht','hb','qtl','qtr','qbl','qbr','diag','dtr','dbl','dbr','tri','tri2','tri3','lmid','ltop','lbot','fh','fv','check','sq','oval','rhomb','circ','ring','pent','hex','oct','star','star4','star6','star8','sun','sun2','moon','heart','plus','tri4','tril','semi','semib','trap','chev','arrow','bolt','drop','leaf','shield','crown','wave','zig','dots','flower','star12','ring2','qcirc'];
const DY={ltop:12,lbot:88},SH=new Set(['tri4','tril','semi','semib','trap','chev','arrow','bolt','drop','leaf','shield','crown','dots','flower','star12','ring2','tri','tri2','tri3','sq','oval','rhomb','circ','ring','pent','hex','oct','star','star4','star6','star8','sun','sun2','moon','heart','plus','tri4','tril','semi','semib','trap','chev','arrow','bolt','drop','leaf','shield','crown','wave','zig','dots','flower','star12','ring2','qcirc']),dsf=t=>SH.has(t)?60:100;
function bar(c,x1,y1,x2,y2,t){const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy),nx=-dy/d*t,ny=dx/d*t;c.moveTo(x1+nx,y1+ny);c.lineTo(x2+nx,y2+ny);c.lineTo(x2-nx,y2-ny);c.lineTo(x1-nx,y1-ny);c.closePath()}
function ng(c,n,r){for(let i=0;i<n;i++){const a=i*6.2832/n-1.5708;c[i?'lineTo':'moveTo'](r*Math.cos(a),r*Math.sin(a))}c.closePath()}
function sp(c,n,R,r){for(let i=0;i<2*n;i++){const a=i*Math.PI/n-1.5708,q=i%2?r:R;c[i?'lineTo':'moveTo'](q*Math.cos(a),q*Math.sin(a))}c.closePath()}
function draw(c,W,H,L){c.clearRect(0,0,W,H);for(const l of L){const k=l.s/100,u=H*k,t=l.t,w=W/2,h=H/2;c.save();c.fillStyle=l.c;c.translate(l.x/100*W,l.y/100*H);c.rotate(l.r*Math.PI/180);c.globalAlpha=(l.o??100)/100;c.scale((l.fl?-1:1)*(l.sx??100)/100,1);c.beginPath();
const R=(...a)=>c.rect(...a),P=pts=>pts.forEach((q,i)=>c[i?'lineTo':'moveTo'](q[0],q[1]));
if(t=='solid')R(-W*k/2,-u/2,W*k,u);
else if(t=='h2'){R(-W*2,-h,W*4,u/4);R(-W*2,h-u/4,W*4,u/4)}
else if(t=='h3')R(-W*2,-u/6,W*4,u/3);
else if(t=='fm2')R(-W*2,-(H-u/2)/2,W*4,H-u/2);
else if(t=='v2'){R(-w,-H*2,W*k/3,H*4);R(w-W*k/3,-H*2,W*k/3,H*4)}
else if(t=='vm2')R(-(W-W*k*2/3)/2,-H*2,W-W*k*2/3,H*4);
else if(t=='mfa')R(-W*2,-h,W*4,u/6);
else if(t=='mfm')R(-W*2,-u/12,W*4,u/6);
else if(t=='mfb')R(-W*2,h-u/6,W*4,u/6);
else if(t=='fl3')R(-w,-H*2,W*k/3,H*4);
else if(t=='fr3')R(w-W*k/3,-H*2,W*k/3,H*4);
else if(t=='fta')R(-W*2,-h,W*4,u/3);
else if(t=='fme')R(-W*2,-u/6,W*4,u/3);
else if(t=='fba')R(-W*2,h-u/3,W*4,u/3);
else if(t=='v3')R(-W*k/6,-H*2,W*k/3,H*4);
else if(t=='cross'){R(-u*.09,-H*2,u*.18,H*4);R(-W*2,-u*.09,W*4,u*.18)}
else if(t=='nordic'){R(-w*.35-u*.09,-H*2,u*.18,H*4);R(-W*2,-u*.09,W*4,u*.18)}
else if(t=='saltire'){bar(c,-W,-H,W,H,u*.1);bar(c,-W,H,W,-H,u*.1)}
else if(t=='half')R(-w,-h,W*k/2,H);
else if(t=='hr')R(w-W*k/2,-h,W*k/2,H);
else if(t=='ht')R(-w,-h,W,H*k/2);
else if(t=='hb')R(-w,h-H*k/2,W,H*k/2);
else if(t=='qtl')R(-w,-h,W*k/2,H*k/2);
else if(t=='qtr')R(w-W*k/2,-h,W*k/2,H*k/2);
else if(t=='qbl')R(-w,h-H*k/2,W*k/2,H*k/2);
else if(t=='qbr')R(w-W*k/2,h-H*k/2,W*k/2,H*k/2);
else if(t=='diag')P([[-w,-h],[-w+W*k,-h],[-w,-h+H*k]]);
else if(t=='dtr')P([[w,-h],[w-W*k,-h],[w,-h+H*k]]);
else if(t=='dbl')P([[-w,h],[-w+W*k,h],[-w,h-H*k]]);
else if(t=='dbr')P([[w,h],[w-W*k,h],[w,h-H*k]]);
else if(t=='tri')P([[-w,-u/2],[-w+W*k/2,0],[-w,u/2]]);
else if(t=='tri2')P([[0,-u*.45],[u*.5,u*.4],[-u*.5,u*.4]]);
else if(t=='tri3')P([[0,u*.45],[u*.5,-u*.4],[-u*.5,-u*.4]]);
else if(t[0]=='l')R(-W*2,-u*.04,W*4,u*.08);
else if(t=='fh')for(let i=0;i<9;i+=2)R(-W*2,-h+i*H/9,W*4,H/9);
else if(t=='fv')for(let i=0;i<5;i+=2)R(-w+i*W/5,-H*2,W/5,H*4);
else if(t=='check'){for(let i=0;i<8;i++)for(let j=0;j<6;j++)if((i+j)%2==0)R(-w+i*W/8,-h+j*H/6,W/8,H/6)}
else if(t=='sq')R(-u*.4,-u*.4,u*.8,u*.8);
else if(t=='oval')c.ellipse(0,0,W*k*.4,u*.28,0,0,2*Math.PI);
else if(t=='rhomb')P([[0,-u/2],[W*k/2,0],[0,u/2],[-W*k/2,0]]);
else if(t=='circ')c.arc(0,0,u*.4,0,2*Math.PI);
else if(t=='ring'){c.arc(0,0,u*.4,0,2*Math.PI);c.closePath();c.moveTo(u*.26,0);c.arc(0,0,u*.26,0,2*Math.PI,true);c.closePath()}
else if(t=='pent')ng(c,5,u*.42);else if(t=='hex')ng(c,6,u*.42);else if(t=='oct')ng(c,8,u*.42);
